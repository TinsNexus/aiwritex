<div id="config-img-api" class="config-panel">  
    <div class="config-header">  
        <div class="header-content">  
            <div>  
                <h2 data-i18n="imgapi.heading">图片生成API</h2>  
                <p class="config-description" data-i18n="imgapi.description">设置图片生成服务的API密钥和参数</p>  
            </div>  
        </div>  
    </div>  
      
    <div class="config-form">  
        <!-- 图片API提供商卡片容器 -->  
        <div id="img-api-providers-container">  
            <!-- 动态生成提供商卡片 -->  
        </div>  
          
        <!-- 提示信息 -->  
        <div class="config-notice">  
            <svg class="notice-icon" viewBox="0 0 24 24">  
                <circle cx="12" cy="12" r="10"/>  
                <line x1="12" y1="16" x2="12" y2="12"/>  
                <line x1="12" y1="8" x2="12.01" y2="8"/>  
            </svg>  
            <div class="notice-content">  
                <strong data-i18n="common.settings_note">设置说明:</strong>  
                <ul>  
                    <li data-i18n="imgapi.note_1">Picsum: 免费随机图片服务,无需设置</li>  
                    <li data-i18n="imgapi.note_2">阿里: 需要设置API KEY和模型参数</li>  
                    <li data-i18n="imgapi.note_3">点击"设为当前"切换使用的图片生成服务</li>  
                </ul>  
            </div>  
        </div>  
    </div>  
      
    <div class="config-actions">  
        <button type="button" class="btn btn-primary" id="save-img-api-config">  
            <span data-i18n="common.save">保存设置</span>  
        </button>  
        <button type="button" class="btn btn-secondary" id="reset-img-api-config">  
            <span data-i18n="common.restore_default">恢复默认</span>  
        </button>  
    </div>  
</div>
