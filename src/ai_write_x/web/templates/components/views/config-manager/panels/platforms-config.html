<div id="config-platforms" class="config-panel">  
    <div class="config-header">  
        <h2 data-i18n="plat.heading">热搜平台</h2>  
        <p class="config-description" data-i18n="plat.description">设置各平台热搜话题的随机选取权重,控制选用优先级</p>  
    </div>  
      
    <div class="config-form">  
        <!-- 平台列表 -->  
        <div class="config-section">  
            <h3 class="section-title">  
                <span data-i18n="plat.list_section">热搜平台列表</span>  
            </h3>  
              
            <div class="platform-list-container">  
                <table class="platform-table">  
                    <thead>  
                        <tr>  
                            <th class="col-enabled" data-i18n="plat.col_enabled">启用</th>  
                            <th class="col-platform" data-i18n="plat.col_platform">平台</th>  
                            <th class="col-weight" data-i18n="plat.col_weight">权重</th>  
                            <th class="col-description" data-i18n="plat.col_description">说明</th>  
                        </tr>  
                    </thead>  
                    <tbody id="platform-list-body">  
                        <!-- 动态生成平台行 -->  
                    </tbody>  
                </table>  
            </div>
        </div>
        <!-- 提示信息 -->  
        <div class="config-notice">  
            <svg class="notice-icon" viewBox="0 0 24 24">  
                <circle cx="12" cy="12" r="10"/>  
                <line x1="12" y1="16" x2="12" y2="12"/>  
                <line x1="12" y1="8" x2="12.01" y2="8"/>  
            </svg>  
            <div class="notice-content">  
                <strong data-i18n="common.settings_note">设置说明:</strong>  
                <ul>  
                    <li data-i18n="plat.note_1">根据权重随机一个平台,获取其当前的最热门话题</li>  
                    <li data-i18n="plat.note_2">不启用则不会被选取,全部不启用默认采用微博</li>  
                    <li data-i18n="common.note_runtime_only">修改设置仅当前运行有效，永久生效需保存设置</li>  
                </ul>  
            </div>  
        </div> 
    </div>  
      
    <div class="config-actions">  
        <button type="button" class="btn btn-primary" id="save-platforms-config">  
            <span data-i18n="common.save">保存设置</span>  
        </button>  
        <button type="button" class="btn btn-secondary" id="reset-platforms-config">  
            <span data-i18n="common.restore_default">恢复默认</span>  
        </button>  
    </div>  
</div>
