<div id="config-base" class="config-panel active">  
    <div class="config-header">  
        <h2 data-i18n="base.heading">基础设置</h2>  
        <p class="config-description" data-i18n="base.description">设置系统的基本运行参数和发布设置</p>  
    </div>  
      
    <div class="config-form">  
        <!-- 发布设置区块 -->  
        <div class="config-section">  
            <h3 class="section-title">  
                <span data-i18n="base.publish_section">发布设置</span>  
            </h3>  
            <div class="form-row">  
                <div class="form-group form-group-half">  
                    <label for="publish-platform" data-i18n="base.publish_platform">发布平台</label>  
                    <select id="publish-platform" class="form-control">  
                        <option value="wechat" data-i18n="platform.wechat">微信公众号</option>  
                        <option value="xiaohongshu" data-i18n="platform.xiaohongshu">小红书</option>  
                        <option value="douyin" data-i18n="platform.douyin">抖音</option>  
                        <option value="toutiao" data-i18n="platform.toutiao">今日头条</option>  
                        <option value="baijiahao" data-i18n="platform.baijiahao">百家号</option>  
                        <option value="zhihu" data-i18n="platform.zhihu">知乎</option>  
                        <option value="douban" data-i18n="platform.douban">豆瓣</option>  
                    </select>  
                    <small class="form-help" data-i18n="base.publish_platform_help">选择内容发布的目标平台（当前版本仅支持微信公众号平台）</small>
                </div>  
                
                <div class="form-group form-group-half">  
                    <label for="article-format" data-i18n="base.article_format">文章格式</label>  
                    <select id="article-format" class="form-control">  
                        <option value="html">HTML</option>  
                        <option value="markdown">MARKDOWN</option>  
                        <option value="txt">TXT</option>  
                    </select>  
                    <small class="form-help" data-i18n="base.article_format_help">生成文章的格式类型</small>  
                </div>  
            </div>  
            
            <div class="form-row">  
                <div class="form-group form-group-half">  
                    <label class="checkbox-label">  
                        <input type="checkbox" id="auto-publish">  
                        <span class="checkbox-custom"></span>  
                        <span data-i18n="base.auto_publish">自动发布</span>  
                    </label>  
                    <small class="form-help" data-i18n="base.auto_publish_help">生成文章后自动发布到设置的平台</small>  
                </div>  
                
                <div class="form-group form-group-half">  
                    <label class="checkbox-label">  
                        <input type="checkbox" id="format-publish">  
                        <span class="checkbox-custom"></span>  
                        <span data-i18n="base.format_publish">格式化发布</span>  
                    </label>  
                    <small class="form-help" data-i18n="base.format_publish_help">非HTML格式时，格式化后发布以避免混乱</small>  
                </div>  
            </div>  
        </div>
  
        <!-- 模板设置区块 -->  
        <div class="config-section">  
            <h3 class="section-title">  
                <span data-i18n="base.template_section">模板设置</span>  
            </h3>  
            <div class="form-row">  
                <div class="form-group form-group-third">  
                    <label class="checkbox-label">  
                        <input type="checkbox" id="use-template">  
                        <span class="checkbox-custom"></span>  
                        <span data-i18n="base.use_template">使用模板</span>  
                    </label>  
                    <small class="form-help" data-i18n="base.use_template_help">启用本地内置模板系统生成文章</small>  
                </div>  
                
                <div class="form-group form-group-third">  
                    <label for="config-template-category" data-i18n="cw.template_category">模板分类</label>  
                    <select id="config-template-category" class="form-control" disabled>  
                        <option value="" data-i18n="cw.random_category">随机分类</option>  
                        <!-- 动态加载分类选项 -->  
                    </select>  
                </div>  
                
                <div class="form-group form-group-third">  
                    <label for="template" data-i18n="base.template_select">模板选择</label>  
                    <select id="template" class="form-control" disabled>  
                        <option value="" data-i18n="cw.random_template">随机模板</option>  
                        <!-- 动态加载模板选项 -->  
                    </select>  
                </div>  
            </div>  
            
            <div class="form-row">  
                <div class="form-group form-group-half">  
                    <label class="checkbox-label">  
                        <input type="checkbox" id="use-compress">  
                        <span class="checkbox-custom"></span>  
                        <span data-i18n="base.compress_template">压缩模板</span>  
                    </label>  
                    <small class="form-help" data-i18n="base.compress_template_help">压缩模板以降低token消耗</small>  
                </div>  
            </div>  
        </div>
  
        <!-- 生成设置区块 -->  
        <div class="config-section">  
            <h3 class="section-title">  
                <span data-i18n="base.generate_section">生成设置</span>  
            </h3>  
            <div class="form-row">  
                <div class="form-group form-group-quarter">  
                    <label for="max-search-results" data-i18n="base.max_search">最大搜索数量</label>  
                    <input type="number" id="max-search-results" class="form-control"   
                           min="1" max="20" value="10">  
                    <small class="form-help" data-i18n="base.max_search_help">AIForge返回的最大搜索结果数（1-20）</small>  
                </div>  
                  
                <div class="form-group form-group-quarter">  
                    <label for="min-search-results" data-i18n="base.min_search">最小搜索数量</label>  
                    <input type="number" id="min-search-results" class="form-control"   
                           min="1" max="10" value="3">  
                    <small class="form-help" data-i18n="base.min_search_help">AIForge返回的最小搜索结果数（1-10）</small>  
                </div>  
                  
                <div class="form-group form-group-quarter">  
                    <label for="min-article-len" data-i18n="base.min_len">最小文章字数</label>  
                    <input type="number" id="min-article-len" class="form-control"   
                           min="500" value="800">  
                    <small class="form-help" data-i18n="base.min_len_help">生成文章的最小字数</small>  
                </div>  
                  
                <div class="form-group form-group-quarter">  
                    <label for="max-article-len" data-i18n="base.max_len">最大文章字数</label>  
                    <input type="number" id="max-article-len" class="form-control"   
                           max="5000" value="2000">  
                    <small class="form-help" data-i18n="base.max_len_help">生成文章的最大字数</small>  
                </div>  
            </div>  
        </div>  
    </div>  
      
    <div class="config-actions">  
        <button type="button" class="btn btn-primary" id="save-base-config">  
            <span data-i18n="common.save">保存设置</span>  
        </button>  
        <button type="button" class="btn btn-secondary" id="reset-base-config">  
            <span data-i18n="common.restore_default">恢复默认</span>  
        </button>  
    </div>  
</div>
